<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Web</title>
<style>
:root {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-tertiary: #21262d;
  --bg-input: #0d1117;
  --border: #30363d;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #6e7681;
  --accent: #58a6ff;
  --accent-hover: #79b8ff;
  --green: #3fb950;
  --red: #f85149;
  --orange: #d29922;
  --purple: #bc8cff;
  --user-bubble: #1a2332;
  --assistant-bubble: #1c1c2e;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  height: 100vh;
  display: flex;
  overflow: hidden;
}
/* ── Sidebar ──────────────────────────────────────────────────────────── */
.sidebar {
  width: 280px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: transform 0.3s;
}
.sidebar-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
.sidebar-header .logo {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700;
}
.sidebar-header h1 { font-size: 16px; font-weight: 600; }
.btn-new-chat {
  margin: 12px 16px;
  padding: 10px 16px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: background 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-new-chat:hover { background: var(--accent-hover); }
.session-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.session-item {
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all 0.15s;
  position: relative;
}
.session-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.session-item.active { background: var(--bg-tertiary); color: var(--text-primary); border-left: 3px solid var(--accent); }
.session-item .title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.session-item .delete-btn {
  opacity:0; background:none; border:none; color:var(--red); cursor:pointer;
  font-size:16px; padding:2px 6px; border-radius:4px;
}
.session-item:hover .delete-btn { opacity:1; }
.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
}
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green);
  display: inline-block;
}
.status-dot.error { background: var(--red); }
/* ── Main ─────────────────────────────────────────────────────────────── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.topbar {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}
.btn-menu {
  background: none; border: none; color: var(--text-secondary);
  cursor: pointer; font-size: 20px; display: none;
}
.topbar .session-title {
  font-size: 14px; font-weight: 500; color: var(--text-secondary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* ── Messages ─────────────────────────────────────────────────────────── */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.message {
  display: flex;
  gap: 12px;
  max-width: 800px;
  width: 100%;
  margin: 0 auto;
  animation: fadeIn 0.25s ease;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.message .avatar {
  width: 32px; height: 32px;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700;
  flex-shrink: 0;
}
.message.user .avatar { background: var(--accent); color: #fff; }
.message.assistant .avatar {
  background: linear-gradient(135deg, var(--accent), var(--purple));
  color: #fff;
}
.message .bubble {
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 14px;
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
}
.message.user .bubble {
  background: var(--user-bubble);
  border: 1px solid var(--border);
}
.message.assistant .bubble {
  background: var(--assistant-bubble);
  border: 1px solid transparent;
}
.message .bubble code {
  background: var(--bg-tertiary);
  padding: 2px 6px;
  border-radius: 4px;
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 13px;
}
.message .bubble pre {
  background: var(--bg-tertiary);
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  overflow-x: auto;
  margin: 8px 0;
  border: 1px solid var(--border);
}
.message .bubble pre code {
  background: none;
  padding: 0;
}
/* ── Typing indicator ─────────────────────────────────────────────────── */
.typing-indicator {
  display: flex; gap: 4px; padding: 8px 0;
}
.typing-indicator span {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--text-muted);
  animation: blink 1.4s infinite both;
}
.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100%{opacity:0.3;} 40%{opacity:1;} }
/* ── Input ────────────────────────────────────────────────────────────── */
.input-area {
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  background: var(--bg-secondary);
  flex-shrink: 0;
}
.input-wrapper {
  max-width: 800px;
  margin: 0 auto;
  display: flex;
  gap: 10px;
  align-items: flex-end;
}
#messageInput {
  flex: 1;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  color: var(--text-primary);
  font-size: 14px;
  font-family: inherit;
  resize: none;
  outline: none;
  min-height: 44px;
  max-height: 200px;
  line-height: 1.5;
  transition: border-color 0.2s;
}
#messageInput:focus { border-color: var(--accent); }
#messageInput::placeholder { color: var(--text-muted); }
.btn-send {
  width: 44px; height: 44px;
  border-radius: var(--radius-sm);
  border: none;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
  flex-shrink: 0;
}
.btn-send:hover { background: var(--accent-hover); }
.btn-send:disabled { background: var(--bg-tertiary); color: var(--text-muted); cursor: not-allowed; }
.btn-send svg { width: 20px; height: 20px; }
.btn-stop {
  width: 44px; height: 44px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-tertiary);
  color: var(--red);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.btn-stop:hover { border-color: var(--red); }
/* ── Welcome ──────────────────────────────────────────────────────────── */
.welcome {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  color: var(--text-muted);
}
.welcome .logo-big {
  width: 64px; height: 64px;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; font-weight: 700; color: #fff;
}
.welcome h2 { font-size: 22px; color: var(--text-primary); }
.welcome p { font-size: 14px; text-align: center; max-width: 400px; line-height: 1.6; }
/* ── Scrollbar ────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
/* ── Responsive ───────────────────────────────────────────────────────── */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    z-index: 100;
    transform: translateX(-100%);
  }
  .sidebar.open { transform: translateX(0); }
  .btn-menu { display: block; }
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 99;
  }
  .overlay.show { display: block; }
}
</style>
</head>
<body>

<!-- Overlay for mobile sidebar -->
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">H</div>
    <h1>Hermes Web</h1>
  </div>
  <button class="btn-new-chat" onclick="newChat()">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="8" y1="3" x2="8" y2="13"/><line x1="3" y1="8" x2="13" y2="8"/></svg>
    Nouvelle conversation
  </button>
  <div class="session-list" id="sessionList"></div>
  <div class="sidebar-footer">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Connexion...</span>
  </div>
</aside>

<!-- Main content -->
<main class="main">
  <div class="topbar">
    <button class="btn-menu" onclick="toggleSidebar()">☰</button>
    <span class="session-title" id="sessionTitle">Nouvelle conversation</span>
  </div>
  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="logo-big">H</div>
      <h2>Bienvenue sur Hermes Web</h2>
      <p>Connecté à votre instance Hermes Agent. Posez une question et laissez l'agent travailler avec ses outils.</p>
    </div>
  </div>
  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="messageInput" placeholder="Envoyez un message à Hermes..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="btn-send" id="btnSend" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
      <button class="btn-stop" id="btnStop" onclick="stopStreaming()" style="display:none;" title="Arrêter le streaming">
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
    </div>
  </div>
</main>

<script>
// ── State ────────────────────────────────────────────────────────────────
let currentSessionId = null;
let conversationHistory = [];
let isStreaming = false;
let abortController = null;
let apiKey = localStorage.getItem('hermes_api_key') || '';

// ── Init ─────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  checkHealth();
  loadSessions();
  // Enter to send, Shift+Enter for new line
  document.getElementById('messageInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
});

// ── Health ───────────────────────────────────────────────────────────────
async function checkHealth() {
  try {
    const r = await fetch('/api/health');
    const data = await r.json();
    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    if (data.status === 'ok') {
      dot.classList.remove('error');
      text.textContent = 'Hermes connecté';
    } else {
      dot.classList.add('error');
      text.textContent = 'Hermes déconnecté';
    }
  } catch {
    document.getElementById('statusDot').classList.add('error');
    document.getElementById('statusText').textContent = 'Hors ligne';
  }
}

// ── Sessions ─────────────────────────────────────────────────────────────
async function loadSessions() {
  try {
    const r = await fetch('/api/sessions?limit=50');
    const data = await r.json();
    const list = document.getElementById('sessionList');
    list.innerHTML = '';
    if (data.sessions) {
      data.sessions.reverse().forEach(s => {
        const div = document.createElement('div');
        div.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
        div.innerHTML = `
          <span class="title">${escapeHtml(s.title || 'Conversation sans titre')}</span>
          <button class="delete-btn" onclick="event.stopPropagation(); deleteSession('${s.id}')" title="Supprimer">×</button>
        `;
        div.onclick = () => selectSession(s);
        list.appendChild(div);
      });
    }
  } catch(e) {
    console.error('Failed to load sessions:', e);
  }
}

async function selectSession(session) {
  currentSessionId = session.id;
  document.getElementById('sessionTitle').textContent = session.title || 'Conversation';
  document.getElementById('messages').innerHTML = '';
  conversationHistory = [];

  try {
    const r = await fetch(`/api/sessions/${session.id}/messages`);
    const data = await r.json();
    if (data.messages) {
      data.messages.forEach(msg => {
        // Only show user and assistant messages, skip tool messages
        if (msg.role === 'user' || msg.role === 'assistant') {
          addMessageToUI(msg.role, msg.content || (msg.content_text || ''));
          conversationHistory.push(msg);
        }
      });
    }
  } catch(e) {
    console.error('Failed to load messages:', e);
  }

  loadSessions();
}

async function deleteSession(id) {
  if (!confirm('Supprimer cette conversation ?')) return;
  try {
    await fetch(`/api/sessions/${id}`, { method: 'DELETE' });
    if (currentSessionId === id) {
      currentSessionId = null;
      conversationHistory = [];
      document.getElementById('messages').innerHTML = `
        <div class="welcome" id="welcome">
          <div class="logo-big">H</div>
          <h2>Bienvenue sur Hermes Web</h2>
          <p>Connecté à votre instance Hermes Agent. Posez une question et laissez l'agent travailler.</p>
        </div>`;
    }
    loadSessions();
  } catch(e) {
    console.error('Failed to delete session:', e);
  }
}

function newChat() {
  currentSessionId = null;
  conversationHistory = [];
  document.getElementById('sessionTitle').textContent = 'Nouvelle conversation';
  document.getElementById('messages').innerHTML = `
    <div class="welcome" id="welcome">
      <div class="logo-big">H</div>
      <h2>Bienvenue sur Hermes Web</h2>
      <p>Connecté à votre instance Hermes Agent. Posez une question et laissez l'agent travailler.</p>
    </div>`;
  loadSessions();
  document.getElementById('messageInput').focus();
  if (window.innerWidth < 768) toggleSidebar();
}

// ── Messages ─────────────────────────────────────────────────────────────
function addMessageToUI(role, content) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.innerHTML = `
    <div class="avatar">${role === 'user' ? 'Vous' : 'H'}</div>
    <div class="bubble">${role === 'assistant' ? formatContent(content) : escapeHtml(content)}</div>
  `;
  container.appendChild(div);
  scrollToBottom();
  return div;
}

function formatContent(content) {
  if (!content) return '';
  let html = escapeHtml(content);
  // Basic code block detection
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  return html;
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function scrollToBottom() {
  const messages = document.getElementById('messages');
  messages.scrollTop = messages.scrollHeight;
}

// ── Send message ─────────────────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if (!text || isStreaming) return;

  // Add user message
  addMessageToUI('user', text);
  conversationHistory.push({ role: 'user', content: text });
  input.value = '';
  input.style.height = 'auto';

  // Hide welcome
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  // Show typing indicator
  const container = document.getElementById('messages');
  const typingDiv = document.createElement('div');
  typingDiv.className = 'message assistant';
  typingDiv.id = 'typingIndicator';
  typingDiv.innerHTML = `
    <div class="avatar">H</div>
    <div class="bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>
  `;
  container.appendChild(typingDiv);
  scrollToBottom();

  // Create session if needed
  if (!currentSessionId) {
    try {
      const r = await fetch('/api/sessions', { method: 'POST' });
      const data = await r.json();
      if (data.id) {
        currentSessionId = data.id;
      }
    } catch(e) {
      console.error('Failed to create session:', e);
    }
  }

  // Build messages for API
  const apiMessages = conversationHistory.map(m => ({
    role: m.role,
    content: m.content
  }));

  // Update UI state
  isStreaming = true;
  document.getElementById('btnSend').disabled = true;
  document.getElementById('btnStop').style.display = 'flex';
  typingDiv.remove();

  // Create assistant bubble
  const msgDiv = addMessageToUI('assistant', '');
  const bubble = msgDiv.querySelector('.bubble');
  let fullContent = '';

  // Streaming request
  abortController = new AbortController();
  try {
    const response = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(apiKey ? { 'Authorization': `Bearer ${apiKey}` } : {})
      },
      body: JSON.stringify({
        model: 'hermes-agent',
        messages: apiMessages,
        stream: true,
        ...(currentSessionId ? { 'extra_body': { 'session_id': currentSessionId } } : {})
      }),
      signal: abortController.signal
    });

    if (!response.ok) {
      const err = await response.text();
      throw new Error(`HTTP ${response.status}: ${err}`);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
          try {
            const json = JSON.parse(line.slice(6));
            const delta = json.choices?.[0]?.delta?.content;
            if (delta) {
              fullContent += delta;
              bubble.innerHTML = formatContent(fullContent);
              scrollToBottom();
            }
          } catch(e) { /* skip parse errors */ }
        }
      }
    }

    // Save assistant message to history
    conversationHistory.push({ role: 'assistant', content: fullContent });

  } catch(e) {
    if (e.name !== 'AbortError') {
      bubble.innerHTML = `<span style="color:var(--red)">Erreur: ${escapeHtml(e.message)}</span>`;
      console.error('Streaming error:', e);
    }
  } finally {
    isStreaming = false;
    abortController = null;
    document.getElementById('btnSend').disabled = false;
    document.getElementById('btnStop').style.display = 'none';
    loadSessions();
  }
}

function stopStreaming() {
  if (abortController) {
    abortController.abort();
  }
}

// ── Utilities ────────────────────────────────────────────────────────────
function handleKey(e) {
  // Handled inline
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
</script>
</body>
</html>
